server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS embebido de Docker. Hace falta declararlo para poder resolver el
    # upstream en tiempo de ejecución (ver el comentario de abajo).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # La API vive en otro contenedor. nginx la proxea bajo el mismo origen
    # para que el navegador no vea dos hosts y no haya CORS ni preflight.
    # `notia-api` es el nombre del servicio en compose: lo resuelve el DNS
    # interno de la red, no hace falta ninguna IP.
    location ~ ^/(api|login|u|salud|webhook)/? {
        # El upstream va en una variable a propósito. Con el nombre literal,
        # nginx lo resuelve UNA VEZ al arrancar y aborta si no existe todavía
        # (`host not found in upstream`), quedando en loop de reinicio. Con
        # una variable la resolución pasa a ser en cada request, así que el
        # orden de arranque deja de importar y un reinicio de la API no
        # obliga a reiniciar nginx.
        set $upstream http://notia-api:3000;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un archivo la resuelve el router del
    # cliente, así que se devuelve el index y no un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
