# Configuración de Spec-Driven Development.
schema: spec-driven

context: |
  Repositorio de la práctica de Ingeniería del Software 3 (UCC 2026).
  La app del semestre es notia: monorepo pnpm con core (Drizzle + Postgres),
  api (Hono), worker (OpenAI) y web (React + Vite). Los tests son vitest, con
  PGlite en memoria para core y dobles de fetch para lo que sale a la red.

rules:
  proposal:
    - Incluir plan de rollback en cambios riesgosos
  specs:
    - Escenarios en formato Given/When/Then
    - Usar RFC 2119 (MUST, SHALL, SHOULD, MAY)
  design:
    - Documentar cada decisión con su porqué y las alternativas descartadas
  tasks:
    - Agrupar por fase, numeración jerárquica
  apply:
    - Seguir los patrones del código existente
    tdd: false
    test_command: "pnpm test"
  verify:
    test_command: "pnpm cov:backend && pnpm cov:frontend"
    build_command: "pnpm typecheck"
    # El umbral real vive en vitest.backend.config.ts (90 líneas / 80 ramas)
    # y vitest.web.config.ts (95 / 90). Este es el mínimo de los dos.
    coverage_threshold: 80
  archive:
    - Avisar antes de mergear deltas destructivos
