name: CI

# Corre en cada pull request y en cada push a main. Los dos disparadores
# hacen falta: el de PR es el que actúa como gate antes de integrar, y el de
# push a main verifica lo que quedó integrado por si algo entró por otro lado.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si llegan varios pushes seguidos a la misma rama, cancela las corridas
# viejas: la única que importa es la del último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build imagen del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Buildx habilita el cache de capas contra el cache de GitHub Actions.
      # Sin esto, cada corrida reconstruye todas las capas desde cero.
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          # No se publica desde el PR: acá sólo se verifica que compile.
          # La publicación al registry es del TP2 y se hace a mano por ahora.
          push: false
          # `load: false` evita exportar la imagen al daemon, que en CI no
          # sirve para nada y cuesta tiempo.
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  frontend:
    name: Build imagen del frontend
    # Sin `needs:`, así que corre EN PARALELO con backend. No comparten nada:
    # cada job es una máquina virtual limpia, con su propio checkout y su
    # propio filesystem. Lo único que comparten es el cache, y por eso cada
    # uno usa su propio `scope`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
