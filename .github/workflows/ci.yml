name: CI

# Corre en cada pull request y en cada push a main. Los dos disparadores
# hacen falta: el de PR es el que actúa como gate antes de integrar, y el de
# push a main verifica lo que quedó integrado por si algo entró por otro lado.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si llegan varios pushes seguidos a la misma rama, cancela las corridas
# viejas: la única que importa es la del último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacion:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Cachea el store de pnpm entre corridas: la instalación de
          # dependencias es lo más lento de este job.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # El backend corre TypeScript directo con tsx: no hay `tsc` que emita,
      # así que la imagen se construye igual aunque el código no tipe. El
      # equivalente de "compila" para este proyecto es el typecheck, y sin
      # este job el pipeline no verificaría nada del backend.
      - run: pnpm typecheck

  tests-backend:
    name: Tests y cobertura del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # La misma receta que en local: `pnpm cov:backend`. Vitest evalúa los
      # thresholds de vitest.backend.config.ts y sale con error si no se
      # cumplen, aunque todos los tests hayan pasado. Ese error es el que
      # pone el check en rojo.
      - name: Correr los tests con cobertura
        run: pnpm cov:backend

      # Se escribe aunque el paso anterior haya fallado: cuando el umbral
      # frena es justo cuando hay que mirar el número.
      - name: Resumen de cobertura en el run
        if: ${{ !cancelled() }}
        run: node .github/scripts/resumen-cobertura.mjs backend coverage/backend/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: coverage/backend

  tests-frontend:
    name: Tests y cobertura del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Correr los tests con cobertura
        run: pnpm cov:frontend

      - name: Resumen de cobertura en el run
        if: ${{ !cancelled() }}
        run: node .github/scripts/resumen-cobertura.mjs frontend coverage/frontend/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: coverage/frontend

  backend:
    name: Build imagen del backend
    runs-on: ubuntu-latest
    # Desde el TP6 este job PUBLICA, y por eso ya no corre en paralelo con la
    # verificación: espera al typecheck y a los tests de su lado. Si alguno
    # falla, este job ni arranca, así que el paso que publica nunca corre
    # sobre código que no pasó. Se paga en tiempo (los tests tardan ~50 s) y
    # se compra la garantía de la cadena.
    needs: [verificacion, tests-backend]
    # Mínimo privilegio: el permiso de escribir paquetes va en el job que
    # publica, no a nivel del workflow (ahí reemplazaría el default de TODOS
    # los jobs). `contents: read` hace falta porque lo que no se lista queda
    # sin permiso, y sin él el checkout no puede leer el código.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Buildx habilita el cache de capas contra el cache de GitHub Actions.
      # Sin esto, cada corrida reconstruye todas las capas desde cero.
      - uses: docker/setup-buildx-action@v3

      # Sólo en la corrida de `main`. En un PR este paso sale salteado: es
      # la evidencia de que pasó todo y aun así no publicó. Las dos
      # condiciones, no una: si mañana otra rama entra al disparador, un
      # push ahí no debe publicar nada.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Último paso: si se llegó acá es porque todo lo anterior pasó. En un
      # PR construye y no sube (`push: false`); en `main` publica la imagen
      # etiquetada con el commit que la produjo.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/mat1v1dal/notia-api:sha-${{ github.sha }}
          # /salud informa este commit: es lo que el smoke test compara.
          build-args: GIT_COMMIT=${{ github.sha }}
          # `load: false` evita exportar la imagen al daemon, que en CI no
          # sirve para nada y cuesta tiempo.
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  frontend:
    name: Build imagen del frontend
    runs-on: ubuntu-latest
    # Corre en paralelo con el del backend: no comparten nada, cada job es
    # una máquina limpia. Lo único que comparten es el cache, y por eso cada
    # uno usa su propio `scope`.
    needs: [verificacion, tests-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/mat1v1dal/notia-web:sha-${{ github.sha }}
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-qa:
    name: Deploy a QA
    runs-on: ubuntu-latest
    # La promoción arranca donde termina la verificación: sin las dos
    # imágenes publicadas no hay nada que desplegar.
    needs: [backend, frontend]
    # Los PRs verifican; sólo main despliega.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # El environment conecta el job con sus secrets (la clave SSH de QA) y
    # con el historial de Deployments. QA no tiene reviewers: es automático
    # a propósito.
    environment:
      name: qa
      url: http://201.32.128.192:8081
    # Dos merges seguidos no se pisan: el segundo espera al primero.
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desplegar-en-vps
        with:
          entorno: qa
          url: http://201.32.128.192:8081
          clave-ssh: ${{ secrets.VPS_SSH_KEY }}
          commit: ${{ github.sha }}

  deploy-prod:
    name: Deploy a PROD
    runs-on: ubuntu-latest
    # PROD sólo después de QA vivo. No repite el `if` de la rama: lo hereda
    # por la cadena, porque deploy-qa no corre en un PR.
    needs: deploy-qa
    # Acá el workflow SE PAUSA: el environment tiene required reviewers, y
    # hasta que alguien apruebe, el job no arranca y los secrets de PROD no
    # los lee nadie.
    environment:
      name: production
      url: http://201.32.128.192:8082
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Mismo código que QA. Y el commit es el de ESTA corrida, no la punta
      # de main: entre que queda esperando aprobación y que alguien aprueba
      # pueden pasar horas, y main se mueve. El aprobador firma este sha.
      - uses: ./.github/actions/desplegar-en-vps
        with:
          entorno: prod
          url: http://201.32.128.192:8082
          clave-ssh: ${{ secrets.VPS_SSH_KEY }}
          commit: ${{ github.sha }}
