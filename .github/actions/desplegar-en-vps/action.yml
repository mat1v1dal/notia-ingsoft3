# Despliega un entorno de notia en el VPS. La usan los jobs de QA y de PROD:
# los dos entornos se despliegan con EL MISMO código; lo único que cambia es
# el environment de GitHub que lo llama, y con él la clave y el destino.
name: Desplegar en el VPS
description: Copia el compose, fija el tag de la imagen al commit, hace pull + up y corre el smoke test.

inputs:
  entorno:
    description: qa | prod (la carpeta /srv/notia/<entorno> del servidor)
    required: true
  url:
    description: URL pública del entorno, para el smoke test
    required: true
  clave-ssh:
    description: Clave privada del usuario de deploy, desde el environment
    required: true
  commit:
    description: El sha que se despliega (el tag de la imagen es sha-<commit>)
    required: true

runs:
  using: composite
  steps:
    # La clave privada vive en el environment; la pública, en el usuario de
    # deploy del servidor. El host key va fijo: el runner verifica que habla
    # con NUESTRO servidor, no con cualquiera que conteste esa IP.
    - name: Clave SSH del entorno
      shell: bash
      run: |
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "${{ inputs.clave-ssh }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
        echo '201.32.128.192 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILmUHsnuB0KqSZ8vxzYFTGmAtNhen1KMGoBzZZAOZvMX' >> ~/.ssh/known_hosts

    # Se despliega EL commit recibido, no "lo último": el tag de la imagen
    # es el sha. El compose viaja desde el repo en cada deploy; en el
    # servidor sólo persiste el .env con los secretos.
    - name: Desplegar el commit
      shell: bash
      env:
        VPS: notia-deploy@201.32.128.192
        ENTORNO: ${{ inputs.entorno }}
        COMMIT: ${{ inputs.commit }}
      run: |
        scp -i ~/.ssh/deploy deploy/compose.vps.yml "$VPS:/srv/notia/$ENTORNO/compose.yml"
        ssh -i ~/.ssh/deploy "$VPS" "
          cd /srv/notia/$ENTORNO &&
          sed -i 's/^NOTIA_TAG=.*/NOTIA_TAG=sha-$COMMIT/' .env &&
          docker compose pull -q &&
          docker compose up -d --remove-orphans &&
          docker compose ps --format '{{.Service}}\t{{.Image}}\t{{.Status}}'
        "

    # Falla si el entorno no contesta, o si contesta con OTRO commit: un
    # deploy que "terminó" pero dejó la versión anterior corriendo no es
    # un deploy.
    - name: Smoke test
      shell: bash
      run: .github/scripts/smoke.sh "${{ inputs.url }}" "${{ inputs.url }}" "${{ inputs.commit }}" 20 10
